<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Let's Pick</title>
<link rel="stylesheet" href="popup.css">
<main>
  <header>
    <img src="icon-48.png" width="30" height="30" alt="">
    <div class="title">
      <h1>Let's Pick <small id="ver"></small></h1>
      <p id="pageHost">현재 페이지</p>
    </div>
    <button id="refresh" class="icon" type="button" title="다시 찾기" aria-label="다시 찾기"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M26 12a11 11 0 1 0 1 8"/><path d="M26 5v7h-7"/></svg></button>
    <button id="settings" class="icon" type="button" title="설정" aria-label="설정"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M24.5 7.5l-2.8 2.8M10.3 21.7l-2.8 2.8"/></svg></button>
  </header>

  <div class="primary">
    <button id="openPanel" type="button" class="brand" title="페이지 위에 큰 패널을 엽니다">
      <svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="6" width="22" height="20" rx="3"/><path d="M9 11h14M9 16h9M9 21h12"/></svg><span class="btn-label">페이지에서 크게 보기</span> <kbd id="panelKey">Alt+Shift+D</kbd>
    </button>
    <button id="oneClickVideo" type="button" title="재생 중인 영상을 원본 파일로 저장하거나, 막혀 있으면 끝까지 녹화합니다"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="24" height="18" rx="3"/><path d="m13 12 7 4-7 4v-8Z"/></svg><span class="btn-label">영상 저장</span></button>
  </div>

  <nav class="tabs" role="tablist">
    <button data-tab="images" class="active" type="button"><svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="3"/><circle cx="11" cy="12" r="2"/><path d="m6 23 7-7 4 4 3-3 6 6"/></svg>이미지 <b id="n-images">0</b></button>
    <button data-tab="videos" type="button"><svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="24" height="18" rx="3"/><path d="m13 12 7 4-7 4v-8Z"/></svg>영상 <b id="n-videos">0</b></button>
    <button data-tab="svgs" type="button"><svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m12 8-6 8 6 8M20 8l6 8-6 8M18 5l-4 22"/></svg>SVG <b id="n-svgs">0</b></button>
  </nav>

  <div class="filters">
    <input id="search" type="search" placeholder="검색: 파일명·주소  ( / )" autocomplete="off">
    <select id="minPx" title="작은 썸네일·아이콘 숨기기">
      <option value="0">모든 크기</option>
      <option value="200">200px 이상</option>
      <option value="400">400px 이상</option>
      <option value="800">800px 이상</option>
    </select>
  </div>

  <div class="toolbar">
    <label><input id="selectAll" type="checkbox"> 전체 선택</label>
    <span id="count">불러오는 중…</span>
  </div>

  <section id="list" class="grid" aria-live="polite"></section>

  <details class="bulk-group" open>
    <summary><svg class="group-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 6h18M7 16h18M7 26h18"/><path d="M3 6h.01M3 16h.01M3 26h.01"/></svg><span>선택한 항목 처리</span><svg class="group-chevron" viewBox="0 0 32 32" aria-hidden="true"><path d="m8 10 8 8 8-8"/></svg></summary>
    <footer class="bulk-actions">
      <button id="download" type="button" class="brand"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v17M10 15l6 6 6-6M6 25h20"/></svg><span class="btn-label">저장</span></button>
      <button id="zip" type="button"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 6h18v20H7zM12 6v4M16 6v4M20 6v4"/><path d="M13 17h6M13 21h6"/></svg><span class="btn-label">ZIP</span></button>
      <button id="copy" type="button"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="8" width="12" height="14" rx="2"/><path d="M12 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg><span class="btn-label">URL 복사</span></button>
      <button id="meta" type="button"><svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 5h5v5H5V5Zm0 9h5v5H5v-5Zm0 9h5v5H5v-5Zm8-18h14v5H13V5Zm0 9h14v5H13v-5Zm0 9h14v5H13v-5Z"/></svg><span class="btn-label">메타 CSV</span></button>
    </footer>
  </details>
  <p id="status" role="status"></p>

  <details id="historyBox">
    <summary>최근 분석한 페이지</summary>
    <section id="history"></section>
  </details>

  <p class="tips">팁: 페이지에서 이미지를 <b>Alt(⌥)+클릭</b>하면 그 이미지의 원본 주소를 바로 분석합니다. 우클릭 메뉴에도 있어요.</p>
</main>
<script src="shared.js"></script>
<script src="popup.js"></script>
</html>
